name: Keilinks V4 smoke
on:
  push:
    branches: [keilinks-v4-training]
  pull_request:
    paths: ['treino/v4/**', 'busca/web_v4.py', 'api/servidor_v4.py']
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q treino/v4 busca/web_v4.py api/servidor_v4.py
